<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fabián Guamaní Aldaz | Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Roboto', sans-serif; background-color: #fbfbfb; color: #1a1a1a; line-height: 1.6; overflow-x: hidden; }
        a { text-decoration: none; color: inherit; }
        
        /* Hero Section (Ajustado sin contenedor de video) */
        .hero-section { 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            text-align: center; 
            padding: 40px 20px; 
            background: #ffffff; 
        }
        .hero-section h1 { 
            font-size: 3.5rem; 
            font-weight: 300; 
            letter-spacing: -1px; 
            margin-bottom: 24px; 
            color: #111; 
        }
        .hero-section p { 
            font-size: 1.25rem; 
            color: #555; 
            max-width: 650px; 
            margin-bottom: 45px; 
            font-weight: 300; 
            line-height: 1.7; 
        }
        .category-buttons { 
            display: flex; 
            gap: 20px; 
            width: 100%; 
            max-width: 550px; 
            justify-content: center; 
        }
        .btn { 
            flex: 1; 
            padding: 16px 24px; 
            font-size: 0.9rem; 
            font-weight: 500; 
            letter-spacing: 0.5px; 
            border: 1.5px solid #1a1a1a; 
            border-radius: 4px; 
            background: transparent; 
            color: #1a1a1a; 
            cursor: pointer; 
            transition: all 0.25s ease-in-out; 
            text-transform: uppercase; 
            text-align: center; 
        }
        .btn:hover { 
            background: #1a1a1a; 
            color: #ffffff; 
        }
        
        @media (max-width: 768px) {
            .hero-section h1 { font-size: 2.6rem; }
            .hero-section p { font-size: 1.15rem; }
            .category-buttons { flex-direction: column; gap: 15px; }
        }
    </style>
</head>
<body>

    <section class="hero-section" id="welcome">
        <h1>Fabián Guamaní Aldaz</h1>
        <p>2D Animator and Independent Filmmaker specializing in character-driven digital 2D animation, original animated short films, and engaging motion graphics and explainer videos.</p>
        <div class="category-buttons">
            <a href="independent-films.html" class="btn">Films & Series</a>
            <a href="motion-graphics.html" class="btn">Motion & Explainers</a>
        </div>
    </section>

</body>
</html>
