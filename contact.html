<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Fabián Guamaní Aldaz</title>
  
  <!-- Tipografía Roboto (Limpia y moderna) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">

  <style>
    /* Estilos Generales */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Roboto', sans-serif;
      background-color: #0d0d0d; /* Fondo oscuro elegante */
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Contenedor de Contacto */
    .contact-container {
      width: 100%;
      max-width: 600px;
      padding: 40px 20px;
      box-sizing: border-box;
      text-align: center;
    }

    .contact-title {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 700;
      margin-bottom: 20px;
      letter-spacing: -0.5px;
    }

    .contact-description {
      font-size: clamp(1rem, 3vw, 1.15rem);
      font-weight: 300;
      line-height: 1.6;
      color: #a0a0a0;
      margin-bottom: 40px;
    }

    /* --- Solución para el Correo Responsivo y Centrado --- */
    .email-wrap {
      display: block;
      width: 100%;
      max-width: 100%;
      margin: 0 auto 40px auto;
      padding: 0 15px; /* Un poco más de margen interno para asegurar el centrado */
      box-sizing: border-box;
    }

    .contact-email {
      display: inline-block;
      text-decoration: none;
      color: #ffffff;
      font-weight: 400;
      transition: color 0.3s ease;
      
      /* Reducido: tamaño base más pequeño y progresión visual más controlada */
      font-size: clamp(0.9rem, 3.8vw, 1.8rem); 
      
      /* Fuerza el centrado absoluto */
      text-align: center;
      word-wrap: break-word;
      word-break: break-all;
      overflow-wrap: break-word;
      max-width: 100%;
    }

    .contact-email:hover {
      color: #707070;
    }

    /* Enlaces a Redes / Portafolios */
    .social-links {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .social-link {
      color: #a0a0a0;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 400;
      transition: color 0.3s ease;
    }

    .social-link:hover {
      color: #ffffff;
    }

    /* --- AJUSTE ESTRICTO PARA MÓVILES --- */
    /* Cubre la gran mayoría de teléfonos en posición vertical (ancho menor a 480px) */
    @media (max-width: 480px) {
      .contact-email {
        /* Tamaño de fuente ultracompacto ideal para correos largos en pantallas pequeñas */
        font-size: 0.85rem !important; 
        letter-spacing: 0.5px;
      }
    }

    /* Para teléfonos extremadamente pequeños (ancho menor a 340px) */
    @media (max-width: 340px) {
      .contact-email {
        font-size: 0.75rem !important;
      }
    }
  </style>
</head>
<body>

  <main class="contact-container">
    <h1 class="contact-title">Let's work together</h1>
    <p class="contact-description">
      I’m always open to new freelance opportunities and creative collaborations, both in cinematic film and commercial motion. Drop me a line!
    </p>
    
    <!-- Contenedor del correo electrónico -->
    <div class="email-wrap">
      <a href="mailto:tu-correo@dominio.com" class="contact-email">tu-correo@dominio.com</a>
    </div>

    <!-- Enlaces adicionales -->
    <div class="social-links">
      <a href="https://vimeo.com/" class="social-link" target="_blank" rel="noopener">Vimeo</a>
      <a href="https://behance.net/" class="social-link" target="_blank" rel="noopener">Behance</a>
      <a href="https://linkedin.com/" class="social-link" target="_blank" rel="noopener">LinkedIn</a>
    </div>
  </main>

</body>
</html>
