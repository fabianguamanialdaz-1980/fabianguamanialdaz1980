    <style>

        body { font-family: 'Roboto', sans-serif; background-color: #fbfbfb; color: #1a1a1a; line-height: 1.6; }
        a { text-decoration: none; color: inherit; }
        
        .navbar { position: fixed; top: 0; left: 0; width: 100%; background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(8px); border-bottom: 1px solid #eaeaea; padding: 18px 5%; display: flex; justify-content: space-between; align-items: center; z-index: 1000; }

        .contact-content { margin-top: 20px; }
        .contact-content p { font-size: 1.1rem; color: #555; font-weight: 300; margin-bottom: 15px; }
        .email-link { font-size: 1.8rem; font-weight: 300; color: #1a1a1a; letter-spacing: -0.5px; transition: color 0.2s; }
        .email-link:hover { color: #666; }
        
        footer { background: #111111; color: #ffffff; text-align: center; padding: 40px 20px; position: absolute; bottom: 0; width: 100%; }
        footer p { font-size: 0.85rem; color: #777; font-weight: 300; }
        @media (max-width: 768px) { .navbar { flex-direction: column; gap: 15px; text-align: center; padding: 15px; position: relative; } .section-container { padding-top: 40px; } footer { position: relative; margin-top: 120px; } }
