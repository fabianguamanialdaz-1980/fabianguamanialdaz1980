  <!-- Modal Overlay -->
  <div id="project-modal" class="modal-overlay" onclick="closeModal(event)">

      <div class="modal-body">

        </div>

        </div>
      </div>
    </div>

  <script>
    function toggleSound(videoId, btnId) {
      const video = document.getElementById(videoId);
      const btn = document.getElementById(btnId);
      if (video.muted) {
        video.muted = false;
        btn.textContent = '🔇 Mute';
      } else {
        video.muted = true;
        btn.textContent = '🔊 Unmute';
      }
    }

    function openModal(title, htmlDescription, vimeoId) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-description').innerHTML = htmlDescription;
      const iframe = document.getElementById('modal-vimeo-iframe');
      iframe.src = `https://player.vimeo.com/video/${vimeoId}?autoplay=1&title=0&byline=0&portrait=0`;
      document.getElementById('project-modal').classList.add('active');
    }

    function closeModal(event, force = false) {
      if (force || (event && event.target.classList.contains('modal-overlay'))) {
        const modal = document.getElementById('project-modal');
        const iframe = document.getElementById('modal-vimeo-iframe');
        iframe.src = '';
        modal.classList.remove('active');
      }
    }
  </script>
